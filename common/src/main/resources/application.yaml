spring:
  application:
    name: common
    datasource:
      url: "jdbc:mysql://localhost:3306/zjysky?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true"
      username: zjysky
      password: "123456"
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        pool-name: zjysky-crawler-pool
        maximum-pool-size: 5
        connection-timeout: 30000
        idle-timeout: 600000

common:
  db:
    mapper-locations: classpath*:/mapper/**/*.xml
